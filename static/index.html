    <style>
      /* First paint before the app bundle and stylesheet arrive; hidden once React fills #root. */
      #root:not(:empty) + #boot { display: none; }
      /* After the first successful paint, never show the splash again —
         even if a render crash empties #root (Firefox JianpuRender.destroy). */
      html[data-puxian-ready] #boot { display: none !important; }
      html, body { margin: 0; background: #faf8f4; color: #1c1916; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans SC", sans-serif; }
      .boot { max-width: 1024px; margin: 0 auto; padding: max(24px, env(safe-area-inset-top)) 16px 40px; }
      .boot-brand { display: flex; align-items: center; gap: 8px; font-size: 20px; font-weight: 500; padding-bottom: 20px; border-bottom: 1px solid #ddd6c8; }
      .boot-line { height: 14px; border-radius: 7px; background: #eee8dc; margin-top: 14px; }
      .boot-card { height: 120px; border-radius: 20px; background: #f7f3ea; border: 1px solid #ddd6c8; margin-top: 28px; }
      .boot-status { margin-top: 18px; font-size: 14px; color: #6f675e; }
      .boot-shimmer { animation: boot-pulse 1.2s ease-in-out infinite alternate; }
      @keyframes boot-pulse { from { opacity: .55; } to { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { .boot-shimmer { animation: none; } }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="boot" class="boot" aria-busy="true">
      <div class="boot-brand">♪ 谱线</div>
      <div class="boot-shimmer">
        <div class="boot-line" style="width: 46%; height: 28px; margin-top: 36px"></div>
        <div class="boot-line" style="width: 64%"></div>
        <div class="boot-card"></div>
        <div class="boot-card" style="height: 64px"></div>
      </div>
      <p class="boot-status">正在打开谱线…</p>
    </div>
    <script type="module" src="./main.tsx"></script>
  </body>
