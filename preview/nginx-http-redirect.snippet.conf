# Include from the http { } context, not from inside an HTTPS server.
# Sends plain HTTP for the site and www to the canonical HTTPS origin.
# This does not change an edge proxy (Pingora) that never connects here.
#
#   include /etc/nginx/snippets/puxian-http-redirect.conf;

server {
    listen 80;
    listen [::]:80;
    server_name 818189.xyz www.818189.xyz;
    server_tokens off;
    return 301 https://818189.xyz$request_uri;
}
