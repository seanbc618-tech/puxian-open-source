# Same-origin geom OMR API. Include inside the HTTPS server block.
# Snapshot the site nginx config before adding this. Bind of the upstream
# must stay on 127.0.0.1 (see puxian-geom-omr.service).
#
#   include /etc/nginx/snippets/puxian-geom-omr.conf;
#
# Also set client_max_body_size 20m; in the same server (or already larger).
# HTTP→HTTPS for port 80 is a separate server block: nginx-http-redirect.snippet.conf.
# Do not include that file inside this HTTPS server.

server_tokens off;

# Default mime.types has no webmanifest entry, so nginx serves it as
# application/octet-stream. This location keeps the site root and only
# fixes the type.
location = /manifest.webmanifest {
    default_type application/manifest+json;
}

location /api/geom-omr {
    proxy_pass http://127.0.0.1:18096;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 10s;
    proxy_send_timeout 180s;
    proxy_read_timeout 180s;
    proxy_request_buffering on;
    client_max_body_size 20m;
}
