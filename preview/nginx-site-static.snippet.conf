# Real static files that must not fall through to the SPA index.html.
# Include inside the HTTPS server, before any location / { try_files ... /index.html; }.
# An exact match wins over a prefix fallback, so client routes still use the SPA.
#
#   include /etc/nginx/snippets/puxian-site-static.conf;
#
# Paths are relative to the server root (the deployed dist-static tree).

location = /robots.txt {
    default_type text/plain;
    charset utf-8;
    add_header Content-Type "text/plain; charset=utf-8" always;
    try_files /robots.txt =404;
}

location = /privacy.html {
    default_type text/html;
    charset utf-8;
    try_files /privacy.html =404;
}
